spring.application.name=netcentral
server.address=${NC_BIND_ADDRESS:0.0.0.0}
server.port=${NC_HTTP_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Relative paths are resolved from the process working directory, not the JAR.
spring.datasource.url=jdbc:h2:file:${NC_DB_DIR:./data}/netcentral;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=netcentral
spring.datasource.password=${NC_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.h2.console.enabled=false
spring.sql.init.mode=never
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.name=SessionID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NC_COOKIE_SECURE:false}
server.servlet.session.timeout=${NC_SESSION_TIMEOUT:30m}
server.servlet.session.persistent=false
server.servlet.session.tracking-modes=cookie
netcentral.station-visible-seconds=${NC_STATION_VISIBLE_SECONDS:86400}
netcentral.schedule-timezone=${NC_SCHEDULE_TIMEZONE:UTC}
netcentral.live-resource-limit=${NC_LIVE_RESOURCE_LIMIT:5000}
