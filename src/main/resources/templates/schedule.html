<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/account :: head('Schedule')}"></head>
<body><header th:replace="~{fragments/account :: header}"></header><main class="workspace" th:with="s=${detail.schedule}">
<div th:replace="~{fragments/net-carousel :: carousel}"></div>
<section class="panel" id="net-details"><div class="monitor-section-heading"><h2>Details</h2><div class="monitor-section-actions" th:if="${detail.canManage}"><a class="button-link" th:href="@{/schedules/{id}/edit(id=${s.id})}">Edit Net</a><button type="button" id="delete-schedule">Delete Net</button></div></div>
<div class="net-details-columns"><dl class="resource-facts"><dt>Description</dt><dd th:text="${s.description}"></dd><dt>Net type</dt><dd>Scheduled</dd><dt>Check-in</dt><dd th:text="${s.open ? 'Open' : 'Closed'}"></dd><dt>Status</dt><dd th:text="${s.enabled ? 'Enabled' : 'Disabled'}"></dd></dl><dl class="resource-facts"><dt>Recurrence</dt><dd th:text="${s.type.name() == 'ONE_TIME_ONLY' ? 'Just once' : s.type.name() == 'DAILY' ? 'Every day' : s.type.name() == 'WEEKLY' ? 'Every week' : s.type.name() == 'MONTHLY_DAY' ? 'Monthly on a specific day' : 'Monthly on a relative day'}"></dd><dt>Duration</dt><dd th:text="|${s.duration / 60} hours|"></dd><dt>Net start (local time)</dt><dd th:attr="data-monitor-time=${s.nextStartTime}" th:text="${s.nextStartTime ?: 'None'}"></dd><dt>Time zone</dt><dd th:text="${s.timezone}"></dd></dl></div></section>

<dialog id="delete-schedule-dialog" th:if="${detail.canManage}" aria-labelledby="delete-schedule-title"><h2 id="delete-schedule-title">Delete scheduled net?</h2><p th:text="|Delete ${s.name} (${s.callsign}) and stop all future occurrences? Running nets and archived history will be retained.|"></p>
<form th:action="@{/schedules/{id}/delete(id=${s.id})}" method="post"><input type="hidden" name="version" th:value="${s.version}"><div class="dialog-actions"><button type="submit">Delete Net</button><button type="button" id="delete-schedule-cancel">Cancel</button></div></form></dialog>
</main></body></html>
