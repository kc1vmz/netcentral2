<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/account :: head(${archiveOnly ? 'Net Archive' : 'Nets'})}"></head>
<body><header th:replace="~{fragments/account :: header}"></header><main class="workspace" data-live-index>
<span id="live-status" hidden></span><h1 th:text="${archiveOnly ? 'Net Archive' : 'Nets'}"></h1>
<p class="intro" th:text="${archiveOnly ? 'Information about previous nets, including participants, messages, question and answers.' : 'Information about APRS nets, participants, messages, question, answers and related APRS resources.'}"></p>
<th:block th:unless="${archiveOnly}">
<section class="panel"><div class="section-heading"><h2>Active Nets</h2><a th:href="@{/nets/new}">Create a net</a></div><ul id="active-net-list" class="live-net-list"><li th:each="net : ${nets}"><a th:href="@{/nets/{id}(id=${net.id})}" th:text="|${net.callsign} — ${net.name}|"></a><span th:text="| · ${net.participantCount} checked in|"></span></li></ul></section>
<section class="panel" id="scheduled-nets"><div class="section-heading"><h2>Scheduled nets</h2><a th:href="@{/schedules/new}">Create a scheduled net</a></div>
<p id="empty-schedules" th:hidden="${!schedules.isEmpty()}">No nets scheduled.</p><div class="table-scroll"><table class="schedule-table" id="schedule-table" th:hidden="${schedules.isEmpty()}"><thead><tr><th>Net</th><th>Recurrence</th><th>Next start (local time)</th><th>Enabled</th></tr></thead><tbody id="live-schedule-rows"><tr th:each="s : ${schedules}" th:attr="data-id=${s.id}"><td><a th:href="@{/schedules/{id}(id=${s.id})}" th:text="|${s.callsign} — ${s.name}|"></a></td><td th:text="${s.type.name() == 'ONE_TIME_ONLY' ? 'Just once' : s.type.name() == 'DAILY' ? 'Every day' : s.type.name() == 'WEEKLY' ? 'Every week' : s.type.name() == 'MONTHLY_DAY' ? 'Monthly on a specific day' : 'Monthly on a relative day'}"></td><td th:attr="data-schedule-time=${s.nextStartTime}" th:text="${s.nextStartTime == null ? 'None' : 'Loading local time…'}"></td><td th:text="${s.enabled ? 'Yes' : 'No'}"></td></tr></tbody></table></div></section></th:block>
<section class="panel" th:if="${archiveOnly}"><ul id="archive-net-list" class="live-net-list"><li th:each="net : ${archives}"><a th:href="@{/nets/{id}(id=${net.id})}" th:text="|${net.endTime.toString().substring(0,10)} - ${net.name}|"></a><span hidden></span></li></ul></section>
<script type="module" th:src="@{/js/live-index.mjs}"></script></main></body></html>
