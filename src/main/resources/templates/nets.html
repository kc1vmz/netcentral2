<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/account :: head(${archiveOnly ? 'Net Archive' : 'Nets'})}"></head>
<body><header th:replace="~{fragments/account :: header}"></header><main class="workspace" data-live-index>
<span id="live-status" hidden></span><h1 th:text="${archiveOnly ? 'Net Archive' : 'Nets'}"></h1>
<p class="intro" th:text="${archiveOnly ? 'Information about previous nets, including participants, messages, question and answers.' : 'Information about APRS nets, participants, messages, question, answers and related APRS resources.'}"></p>

<section class="panel" th:if="${archiveOnly}"><ul id="archive-net-list" class="live-net-list"><li th:each="net : ${archives}"><a th:href="@{/nets/{id}(id=${net.id})}" th:text="|${net.endTime.toString().substring(0,10)} - ${net.name}|"></a><span hidden></span></li></ul></section>
<script type="module" th:src="@{/js/live-index.mjs}"></script></main></body></html>
