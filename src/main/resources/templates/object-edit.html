<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configure object | Net Central</title><link rel="icon" th:href="@{/favicon.ico}"><link rel="stylesheet" th:href="@{/css/application.css}"><link rel="stylesheet" th:href="@{/webjars/leaflet/1.9.4/leaflet.css}"><script defer th:src="@{/webjars/leaflet/1.9.4/leaflet.js}"></script><script type="module" th:src="@{/js/net-position.mjs}"></script></head><body><header th:replace="~{fragments/account :: header}"></header><main class="workspace">
<h1 th:text="${object == null ? 'Create object' : 'Edit object'}"></h1><form th:action="@{/objects/save}" method="post" class="panel account-form" id="object-form">
<input type="hidden" name="id" th:value="${object?.id}"><input type="hidden" name="version" th:value="${object?.version ?: -1}"><input type="hidden" name="routingVersion" th:value="${route?.version ?: -1}">
<label>Callsign <input name="callsign" required maxlength="9" th:value="${object?.id}" th:readonly="${object != null}"></label>
<label>Type <select name="type"><option value="RESOURCE" th:selected="${object != null && object.data.path('type').asText() == 'RESOURCE'}">Net Central General Resource</option><option value="SHELTER" th:selected="${object != null && object.data.path('type').asText() == 'SHELTER'}">Net Central Shelter Object</option><option value="EOC" th:selected="${object != null && object.data.path('type').asText() == 'EOC'}">Net Central EOC Object</option><option value="MEDICAL" th:selected="${object != null && object.data.path('type').asText() == 'MEDICAL'}">Net Central Medical Station Object</option><option value="OBJECT" th:selected="${object != null && object.data.path('type').asText() == 'OBJECT'}">Generic APRS Object</option></select></label>
<fieldset><legend>Object location</legend>
<div class="dialog-actions" role="group" aria-label="Location entry method"><button type="button" id="location-manual" aria-pressed="true">Manual entry</button><button type="button" id="location-map" aria-pressed="false">Use map</button></div>
<div id="location-coordinates"><label>Latitude <input id="net-lat" name="lat" type="number" step="any" min="-90" max="90" required th:value="${object == null ? '' : object.data.path('lat').asText('')}"></label>
<label>Longitude <input id="net-lon" name="lon" type="number" step="any" min="-180" max="180" required th:value="${object == null ? '' : object.data.path('lon').asText('')}"></label>
</div>
<div id="location-map-panel" hidden><p>Click the map to select the object location. The marker can be dragged.</p><p id="location-summary" role="status">Select a location on the map.</p>
<div id="net-position-map" style="height:320px" aria-label="Select object location" th:attr="data-tile-url=${mapSettings.tileUrl},data-attribution=${mapSettings.attribution}"></div>
</div></fieldset>
<label>Comment <input name="comment" maxlength="80" th:value="${object?.data?.path('comment')?.asText()}"></label>
<fieldset><legend>APRS symbol</legend><input type="hidden" name="symbolTableId" maxlength="1" th:value="${object == null ? '/' : object.data.path('symbolTableId').asText()}"><input type="hidden" name="symbolTableCode" maxlength="1" th:value="${object == null ? ';' : object.data.path('symbolTableCode').asText()}"><div data-symbol-picker></div></fieldset>
<label class="check"><input type="checkbox" name="alive" value="true" th:checked="${object == null || object.data.path('alive').asBoolean()}"> Active (send periodic beacons)</label>
<label>Communications <select name="communicationMode"><option value="SELECTED" th:selected="${route != null && route.mode == 'SELECTED'}">Selected instances</option><option value="ALL" th:selected="${route == null || route.mode == 'ALL'}">All eligible instances, including future ones</option></select></label>
<fieldset id="net-selected-instances" th:hidden="${route == null || route.mode != 'SELECTED'}"><legend>Selected instances</legend><label class="check" th:each="i : ${instances}"><input type="checkbox" name="communicationInstanceIds" th:value="${i.id}" th:checked="${route != null && route.instanceIds.contains(i.id)}"><span th:text="${i.name}"></span></label><p>An empty selection transmits nowhere.</p></fieldset><div class="dialog-actions"><button type="submit" th:text="${object == null ? 'Create' : 'Update'}"></button><button type="button" id="net-cancel">Cancel</button></div></form>
<dialog id="net-cancel-dialog"><h2>Cancel object changes?</h2><p>Discard your unsaved object changes?</p><div class="dialog-actions"><button type="button" id="net-cancel-confirm" th:attr="data-return-url=${object == null ? '/explorer' : '/objects/' + object.id}">Discard changes</button><button type="button" id="net-cancel-back">Keep editing</button></div></dialog>
<dialog id="object-save-dialog"><h2 th:text="${object == null ? 'Create object?' : 'Update object?'}"></h2><p th:text="${object == null ? 'Create this object with the entered callsign, location and settings?' : 'Apply these changes to this object?'}"></p><div class="dialog-actions"><button type="button" id="object-save-confirm" th:text="${object == null ? 'Create' : 'Update'}"></button><button type="button" id="object-save-back">Cancel</button></div></dialog></main><script defer th:src="@{/js/aprs-symbol-picker.js}"></script><script defer th:src="@{/js/object-edit.js}"></script></body></html>
