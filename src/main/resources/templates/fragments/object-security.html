<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><section class="panel" th:fragment="security" th:if="${showObjectSecurity}"><h2>Object Security</h2><p><a th:href="@{/setup/radio(section='access')}">Manage object security in Settings</a></p><p th:if="${acls.isEmpty()}">No object security rules for this station.</p>
<ul><li th:each="r : ${acls}"><span th:text="${r.data.path('callsignChecked').asText()}"></span> — <span th:text="${r.data.path('allowed').asBoolean() ? 'Allow' : 'Deny'}"></span>; type: <span th:text="${r.data.path('type').asText()}"></span><span th:if="${r.data.path('type').asText() == 'WITHIN_PROXIMITY'}" th:text="|; within ${r.data.path('proximity').asInt()} feet|"></span></li></ul></section></body></html>
