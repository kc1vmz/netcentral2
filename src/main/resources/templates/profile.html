<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/account :: head('My account')}"></head>
<body><header th:replace="~{fragments/account :: header}"></header>
<main class="workspace"><h1 th:text="${editingOther} ? 'Edit local account' : 'My account'">My account</h1>
    <p>Role: <strong th:text="${account.role}"></strong></p>
    <form th:action="@{${accountAction}}" method="post" class="panel account-form">
        <label>Username <input name="emailAddress" th:value="${account.emailAddress}" required maxlength="254" autocomplete="username"></label>
        <label>Callsign <input name="callsign" th:value="${account.callsign?.callsign}" maxlength="20"></label>
        <label>First name <input name="firstName" th:value="${account.firstName}" maxlength="100" autocomplete="given-name"></label>
        <label>Last name <input name="lastName" th:value="${account.lastName}" maxlength="100" autocomplete="family-name"></label>
        <div th:unless="${editingOther}">
            <label for="current-password">Current password (required to change password)</label>
            <div class="password-control"><input id="current-password" name="currentPassword" type="password" autocomplete="current-password">
                <button type="button" data-password-toggle="current-password" data-password-label="current password" aria-controls="current-password" aria-label="Show current password" aria-pressed="false" title="Show current password"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
            </div>
        </div>
        <div>
            <label for="new-password">New password (leave blank to keep it)</label>
            <div class="password-control"><input id="new-password" name="password" type="password" minlength="8" autocomplete="new-password">
                <button type="button" data-password-toggle="new-password" data-password-label="new password" aria-controls="new-password" aria-label="Show new password" aria-pressed="false" title="Show new password"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
            </div>
        </div>
        <button type="submit">Save  </button>
    </form>
    <details class="panel" th:unless="${editingOther}"><summary>Delete my account</summary>
        <p>This permanently removes your local login. The last system administrator cannot be deleted.</p>
        <form th:action="@{/profile/delete}" method="post"><button type="submit">Permanently delete my account</button></form>
    </details>
</main><script defer th:src="@{/js/password-visibility.js}"></script></body></html>
