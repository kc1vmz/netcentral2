<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/account :: head('Operational report')}"></head><body><header th:replace="~{fragments/account :: header}"></header><main>
<h1 th:text="|${id}: ${kind} report|"></h1><form th:action="@{/objects/{id}/reports/{kind}(id=${id},kind=${kind})}" method="post" class="panel account-form">
<label th:each="field : ${fields}"><span th:text="${field.label}"></span><input th:name="${field.name}" th:type="${field.type == 'number' ? 'number' : 'text'}" th:value="${field.type == 'number' ? '0' : ''}" th:required="${field.type == 'number'}" th:placeholder="${field.type == 'datetime' ? 'Optional ISO date/time, e.g. 2026-09-28T12:00:00Z' : ''}" th:min="${field.type == 'number' ? 0 : null}" th:max="${field.type == 'number' ? 99999 : null}"></label>
<p>Status/state use the original numeric codes (0 unknown, 1 standby/closed, 2 active/open). Dates default to now when omitted.</p><button>Record report</button></form></main></body></html>
