<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/account :: head('Net options')}"></head><body><header th:replace="~{fragments/account :: header}"></header><main>
<h1 th:text="|${net.callsign} options|"></h1><p th:if="${scheduleOptions == true}">These settings apply to future occurrences.</p><form th:action="${scheduleOptions == true} ? @{/schedules/{id}/options(id=${net.id})} : @{/nets/{id}/options(id=${net.id})}" method="post" class="panel account-form"><input type="hidden" name="version" th:value="${net.version}">
<label class="check" th:each="key : ${ {'announce','checkinReminder','questionReminder','participantInviteAllowed'} }"><input type="checkbox" th:name="${key}" value="true" th:checked="${options.path(key).asBoolean()}"><span th:text="${#strings.capitalize(key.replaceAll('([a-z])([A-Z])', '$1 $2'))}"></span></label>
<label>Welcome message <input name="checkinMessage" maxlength="67" th:value="${options.path('checkinMessage').asText('Check in with CI')}"></label><p>Optional location for the net object beacon. Leave both empty to omit the position beacon.</p><label>Latitude <input type="number" step="any" min="-90" max="90" name="lat" th:value="${options.path('lat').asText('')}"></label><label>Longitude <input type="number" step="any" min="-180" max="180" name="lon" th:value="${options.path('lon').asText('')}"></label><label>Symbol table or overlay <input name="symbolTableId" maxlength="1" required th:value="${options.path('symbolTableId').asText('/')}"></label><label>Symbol code <input name="symbolTableCode" maxlength="1" required th:value="${options.path('symbolTableCode').asText('n')}"></label><button>Save options</button></form></main></body></html>
