<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/account :: head('Sign in')}"></head>
<body><header th:replace="~{fragments/account :: header}"></header>
<main><h1>Sign in</h1>
    <p th:if="${param.error}" role="alert">Invalid username or password.</p>
    <p th:if="${param.registered}" role="status">Your account is ready. Sign in to continue.</p>
    <p th:if="${param.logout}" role="status">You have signed out.</p>
    <p th:if="${param.updated}" role="status">Your account was updated. Please sign in again.</p>
    <p th:if="${param.deleted}" role="status">Your account was deleted.</p>
    <form th:action="@{/login}" method="post" class="panel account-form">
        <label>Username <input name="username" required maxlength="254" autocomplete="username"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
    </form>
    <a th:href="@{/register}">Register an account</a>
</main></body></html>
